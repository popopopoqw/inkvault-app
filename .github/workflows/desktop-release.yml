name: Desktop Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-desktop:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            args: --target aarch64-apple-darwin
            rust-target: aarch64-apple-darwin
          - platform: macos-latest
            args: --target x86_64-apple-darwin
            rust-target: x86_64-apple-darwin
          - platform: windows-latest
            args: ''
            rust-target: ''
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust-target }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Install frontend dependencies
        run: npm ci

      - name: Build and upload to GitHub Release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: v__VERSION__
          releaseName: '墨匣 __VERSION__'
          releaseBody: |
            桌面客户端（macOS Apple Silicon / Intel，Windows x64）。
            未签名应用：macOS 安装后如提示「已损坏」，在终端执行 xattr -cr /Applications/inkvault.app 后再打开；Windows 如遇 SmartScreen，选「更多信息 → 仍要运行」。
            下载后可用 SHA256SUMS 校验文件完整性：`shasum -a 256 -c SHA256SUMS`（Windows: `certutil -hashfile 文件名 SHA256`）。
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}

  # 全平台产物到齐后生成校验和，随 Release 发布
  checksums:
    needs: build-desktop
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: 生成 SHA256SUMS 并上传
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION=$(python3 -c "import json;print(json.load(open('src-tauri/tauri.conf.json'))['version'])")
          mkdir -p assets
          gh release download "v${VERSION}" --dir assets --clobber
          rm -f assets/SHA256SUMS
          (cd assets && sha256sum * > ../SHA256SUMS)
          cat SHA256SUMS
          gh release upload "v${VERSION}" SHA256SUMS --repo "$GITHUB_REPOSITORY" --clobber
