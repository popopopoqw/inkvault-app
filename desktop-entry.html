<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>墨匣 InkVault</title>
    <style>
      * { box-sizing: border-box; margin: 0; }
      body {
        height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;
        background: radial-gradient(1200px 700px at 20% -10%, #e4e2fd 0%, transparent 55%),
                    radial-gradient(1000px 600px at 110% 110%, #e0e7fb 0%, transparent 50%), #f4f4f8;
        color: #26263a;
      }
      .card {
        width: 380px; max-width: 92vw;
        background: #fff;
        border: 1px solid #e4e4ee;
        border-radius: 16px;
        padding: 34px 32px;
        box-shadow: 0 12px 40px rgba(35, 30, 80, 0.1);
        display: flex; flex-direction: column; gap: 14px;
      }
      .logo { text-align: center; }
      h1 { font-size: 22px; text-align: center; letter-spacing: 0.04em; }
      .sub { color: #77778e; font-size: 13px; text-align: center; margin-bottom: 6px; }
      label { font-size: 13px; font-weight: 500; display: flex; flex-direction: column; gap: 6px; }
      input {
        font: inherit; padding: 9px 11px; border: 1px solid #d4d4e4; border-radius: 8px; outline: none;
        transition: border-color 0.15s, box-shadow 0.15s;
      }
      input:focus { border-color: #4f46e5; box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.12); }
      button {
        font: inherit; padding: 10px; border: none; border-radius: 8px; cursor: pointer;
        background: linear-gradient(135deg, #6d6af7, #4f46e5); color: #fff; font-weight: 600;
        box-shadow: 0 6px 16px rgba(79, 70, 229, 0.25);
      }
      button:disabled { opacity: 0.45; cursor: not-allowed; box-shadow: none; }
      .hint { font-size: 12px; color: #dc2626; min-height: 1em; }
      .note { font-size: 12px; color: #77778e; line-height: 1.7; text-align: center; margin-top: 4px; }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="logo">
        <svg viewBox="0 0 48 48" width="56" height="56">
          <defs>
            <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
              <stop offset="0" stop-color="#6d6af7" />
              <stop offset="1" stop-color="#4f46e5" />
            </linearGradient>
          </defs>
          <rect width="48" height="48" rx="12" fill="url(#g)" />
          <path d="M24 8.5c4.6 6.9 8.6 11 8.6 16.1a8.6 8.6 0 1 1-17.2 0C15.4 19.5 19.4 15.4 24 8.5Z" fill="none" stroke="#fff" stroke-width="2.6" stroke-linejoin="round" />
          <circle cx="24" cy="23.2" r="2.5" fill="#fff" />
          <rect x="22.85" y="24.4" width="2.3" height="4.6" rx="1.15" fill="#fff" />
        </svg>
      </div>
      <h1>墨匣 InkVault</h1>
      <p class="sub">连接你部署的加密笔记服务</p>
      <label>
        服务地址
        <input id="serverUrl" type="url" placeholder="https://your-app.workers.dev" autofocus spellcheck="false" />
      </label>
      <p class="hint" id="hint"></p>
      <button id="connect" disabled>连接</button>
      <p class="note">地址是你部署墨匣后 Cloudflare 分配的域名<br />若要更换地址，用「desktop-entry.html?reset」打开本页</p>
    </div>
    <script>
      const KEY = 'inkvault-server';
      const params = new URLSearchParams(location.search);
      if (params.has('reset')) localStorage.removeItem(KEY);
      const saved = localStorage.getItem(KEY);
      if (saved) {
        location.replace(saved);
      } else {
        const input = document.getElementById('serverUrl');
        const btn = document.getElementById('connect');
        const hint = document.getElementById('hint');
        const normalize = (v) => {
          v = v.trim().replace(/\/+$/, '');
          if (!v) return '';
          if (!/^https?:\/\//i.test(v)) v = 'https://' + v;
          return v;
        };
        const validate = (v) => {
          try { const u = new URL(normalize(v)); return (u.protocol === 'https:' || u.protocol === 'http:') && u.hostname.includes('.'); }
          catch { return false; }
        };
        const refresh = () => {
          const ok = validate(input.value);
          btn.disabled = !ok;
          hint.textContent = input.value && !ok ? '请输入有效的服务地址' : '';
        };
        input.addEventListener('input', refresh);
        const go = () => {
          const url = normalize(input.value);
          if (!validate(url)) return;
          localStorage.setItem(KEY, url);
          location.replace(url);
        };
        btn.addEventListener('click', go);
        input.addEventListener('keydown', (e) => { if (e.key === 'Enter') go(); });
      }
    </script>
  </body>
</html>
