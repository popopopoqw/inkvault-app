[package]
name = "inkvault"
version = "0.1.5"
description = "墨匣桌面客户端（本地 Markdown 笔记）"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
notify = "6"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# 缩小安装包：单编译单元、链接时优化、去符号、面向体积优化
[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
